<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Term Manager</title>
    <!-- CSP 开发/构建同源基础版：tmplug: 是代码级插件（L3）的资源协议。
         构建期 electron.vite.config.ts 会把本 meta 替换为严格版（default-src
         'none' + connect-src 'none' 等，零网络的技术强制）；dev 保留宽松版供
         vite HMR（ws 走 default-src 'self'） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' tmplug:; style-src 'self' 'unsafe-inline'; img-src 'self' tmplug: data:; font-src 'self' tmplug: data:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
